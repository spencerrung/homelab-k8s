apiVersion: v1
kind: Pod
metadata:
  name: good
  namespace: default
spec:
  containers:
  - name: test
    image: busybox:1.37
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: latest
  namespace: default
spec:
  containers:
  - name: test
    image: busybox:latest
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: untagged
  namespace: default
spec:
  containers:
  - name: test
    image: busybox
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-resources
  namespace: default
spec:
  containers:
  - name: test
    image: busybox:1.37
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: default
spec:
  selector:
    matchLabels:
      app: good-deployment
  template:
    metadata:
      labels:
        app: good-deployment
    spec:
      containers:
      - name: test
        image: busybox:1.37
        livenessProbe:
          exec:
            command:
            - 'true'
        readinessProbe:
          exec:
            command:
            - 'true'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-probes
  namespace: default
spec:
  selector:
    matchLabels:
      app: missing-probes
  template:
    metadata:
      labels:
        app: missing-probes
    spec:
      containers:
      - name: test
        image: busybox:1.37
---
apiVersion: v1
kind: Pod
metadata:
  name: excluded-kube-system
  namespace: kube-system
spec:
  containers:
  - name: test
    image: busybox:1.37
    resources: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: excluded-tekton-pipelines
  namespace: tekton-pipelines
spec:
  containers:
  - name: test
    image: busybox:1.37
    resources: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: escaped-latest
  namespace: escape
spec:
  containers:
  - name: test
    image: busybox:latest
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 32Mi
