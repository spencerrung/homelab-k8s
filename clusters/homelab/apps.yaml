---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # Suspended: superseded by apps-web/apps-stateful. Deleted next commit.
  suspend: true
  interval: 10m0s
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/overlays/homelab
  prune: true
  wait: true
  timeout: 5m0s
