---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 2m0s
  dependsOn:
    - name: monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/base/monitoring-configs
  prune: true
  wait: true
  timeout: 5m0s
