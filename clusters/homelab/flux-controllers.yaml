---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-controllers
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/flux-system
  # Controllers/CRDs must not disappear if this entry is accidentally removed.
  prune: false
  wait: true
  timeout: 10m0s
