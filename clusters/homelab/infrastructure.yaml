---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  # Suspended: superseded by sources/infra-controllers/infra-configs/
  # platform-apps, which have adopted its resources. Deleted next commit.
  suspend: true
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/overlays/homelab
  prune: true
  wait: true
  timeout: 5m0s
