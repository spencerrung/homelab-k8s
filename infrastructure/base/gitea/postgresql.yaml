---
# Single-instance PostgreSQL for Gitea (official image), replacing the
# deprecated/broken Bitnami postgresql-ha subchart. Mirrors the Authentik
# pattern in infrastructure/base/authentik/postgresql.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: gitea
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgresql
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: gitea
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
      annotations:
        # Consistent dump inside the volume before the kopia file copy;
        # restore prefers this over the raw datadir
        pre.hook.backup.velero.io/command: '["sh", "-c", "pg_dumpall -U $POSTGRES_USER > /var/lib/postgresql/data/velero-dump.sql"]'
        pre.hook.backup.velero.io/timeout: 5m
    spec:
      containers:
        - name: postgresql
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgresql
          env:
            - name: POSTGRES_DB
              value: gitea
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitea-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 800Mi
              cpu: 2
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
