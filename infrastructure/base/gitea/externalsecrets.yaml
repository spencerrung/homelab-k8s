---
# Gitea OIDC credentials from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: gitea-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: gitea-oidc
        property: client-id
    - secretKey: client-secret
      remoteRef:
        key: gitea-oidc
        property: client-secret
