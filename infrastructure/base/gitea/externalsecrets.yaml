---
# PostgreSQL credentials from Vault (single-instance postgres)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-postgresql
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitea-postgresql
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: gitea/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: gitea/postgresql
        property: password
---
# Gitea OIDC credentials from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: gitea-oidc
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: gitea-oidc
        property: client-id
    - secretKey: secret
      remoteRef:
        key: gitea-oidc
        property: client-secret
