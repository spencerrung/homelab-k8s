---
# Gitea OIDC credentials from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-oidc
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: gitea-oidc
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: gitea-oidc
        property: client-id
    - secretKey: secret
      remoteRef:
        key: gitea-oidc
        property: client-secret
---
# Authentik API token for group sync CronJob
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-api-token
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: authentik-api-token
    creationPolicy: Owner
    template:
      data:
        authentik_token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: authentik/terraform-token
        property: api-token
