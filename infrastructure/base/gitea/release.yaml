---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m
  chart:
    spec:
      chart: gitea
      version: '>=12.0.0'
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: flux-system
      interval: 12h
  values:
    # Global Gitea configuration
    gitea:
      admin:
        username: "gitea_admin"
        email: "admin@alucard.dev"

      config:
        server:
          DOMAIN: code.alucard.dev
          ROOT_URL: https://code.alucard.dev
          PROTOCOL: http
          HTTP_PORT: 3000

        # External single-instance PostgreSQL (see postgresql.yaml).
        # PASSWD is injected from the gitea-postgresql secret via
        # gitea.additionalConfigFromEnvs below (never in Git).
        database:
          DB_TYPE: postgres
          HOST: postgresql.gitea.svc.cluster.local:5432
          NAME: gitea
          USER: gitea

        session:
          PROVIDER: db

        cache:
          ADAPTER: memory

        queue:
          TYPE: level

        service:
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: false
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DEFAULT_ALLOW_CREATE_ORGANIZATION: true
          DEFAULT_ENABLE_TIMETRACKING: true

        packages:
          ENABLED: true
          CHUNKED_UPLOAD_PATH: /data/gitea/tmp/package-upload

        webhook:
          ALLOWED_HOST_LIST: "*.svc.cluster.local"
          SKIP_TLS_VERIFY: true

        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          ACCOUNT_LINKING: login
          USERNAME: email
          UPDATE_AVATAR: true
          OPENID_CONNECT_SCOPES:
            - openid
            - email
            - profile

      # OAuth2 authentication source for Authentik
      oauth:
        - name: 'Authentik'
          provider: 'openidConnect'
          existingSecret: gitea-oidc
          autoDiscoverUrl: 'https://auth.alucard.dev/application/o/gitea/.well-known/openid-configuration'
          iconUrl: 'https://auth.alucard.dev/static/dist/assets/icons/icon.png'
          scopes: 'openid profile email'

      # Inject the database password into app.ini from the ESO-managed secret
      additionalConfigFromEnvs:
        - name: GITEA__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: gitea-postgresql
              key: password

    # Persistence for Git repositories
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""  # Use default storage class

    # Service configuration
    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 22

    # Ingress disabled (using external Traefik ingress)
    ingress:
      enabled: false

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # Bitnami postgresql-ha replaced by the single-instance postgres in
    # postgresql.yaml (deprecated Bitnami HA was chronically crashlooping).
    postgresql-ha:
      enabled: false

    # Chart's bundled single postgres subchart also disabled — we use our own.
    postgresql:
      enabled: false

    # Redis/Valkey disabled: gitea here uses cache=memory, session=db,
    # queue=level, so no external cache is needed.
    redis-cluster:
      enabled: false
    redis:
      enabled: false
