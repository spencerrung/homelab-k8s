---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m
  chart:
    spec:
      chart: gitea
      version: '>=12.0.0'
      sourceRef:
        kind: HelmRepository
        name: gitea
        namespace: flux-system
      interval: 12h
  values:
    # Global Gitea configuration
    gitea:
      admin:
        username: "gitea_admin"
        email: "admin@alucard.dev"

      config:
        server:
          DOMAIN: code.alucard.dev
          ROOT_URL: https://code.alucard.dev
          PROTOCOL: http
          HTTP_PORT: 3000

        # Database configuration auto-configured by postgresql-ha chart

        session:
          PROVIDER: db

        cache:
          ADAPTER: memory

        queue:
          TYPE: level

        service:
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: false
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DEFAULT_ALLOW_CREATE_ORGANIZATION: true
          DEFAULT_ENABLE_TIMETRACKING: true

        oauth2_client:
          ENABLE_AUTO_REGISTRATION: true
          ACCOUNT_LINKING: login
          USERNAME: nickname
          OPENID_CONNECT_SCOPES:
            - openid
            - email
            - profile

      # OAuth2 authentication source for Authentik
      oauth:
        - name: 'Authentik'
          provider: 'openidConnect'
          existingSecret: gitea-oidc
          autoDiscoverUrl: 'https://auth.alucard.dev/application/o/gitea/.well-known/openid-configuration'
          iconUrl: 'https://auth.alucard.dev/static/dist/assets/icons/icon.png'
          scopes: 'openid profile email'

    # Persistence for Git repositories
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""  # Use default storage class

    # Service configuration
    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        type: ClusterIP
        port: 22

    # Ingress disabled (using external Traefik ingress)
    ingress:
      enabled: false

    # Resource limits
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

    # PostgreSQL HA enabled (default) for production use
    postgresql-ha:
      enabled: true
      postgresql:
        replicaCount: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi

    # Redis/Valkey cluster for caching
    redis-cluster:
      enabled: true
      cluster:
        nodes: 3
