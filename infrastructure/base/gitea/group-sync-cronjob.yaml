---
# CronJob to sync Authentik group membership to Gitea admin privileges
# Users in the gitea-admins group in Authentik are automatically promoted to admins in Gitea
# Runs every 15 minutes to keep permissions in sync

apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-group-sync
  namespace: gitea
spec:
  schedule: "*/15 * * * *"  # Run every 15 minutes
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: gitea-group-sync
          containers:
          - name: sync
            image: alpine:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-api-token
                  key: authentik_token
            - name: AUTHENTIK_URL
              value: "https://auth.alucard.dev"
            - name: GITEA_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-admin-token
                  key: token
            - name: GITEA_URL
              value: "https://code.alucard.dev"
            command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Installing curl and jq..."
              apk add --no-cache curl jq

              echo "Syncing Authentik gitea-admins group to Gitea admins"

              # Query Authentik API for gitea-admins group members
              echo "Querying Authentik for gitea-admins group members..."
              MEMBERS=$(curl -s -H "Authorization: Bearer $AUTHENTIK_TOKEN" \
                "$AUTHENTIK_URL/api/v3/core/groups/?name=gitea-admins" | \
                jq -r '.results[0].users[]?' || echo "")

              if [ -z "$MEMBERS" ]; then
                echo "No members found in gitea-admins group or group doesn't exist yet"
                exit 0
              fi

              echo "Found user IDs: $MEMBERS"

              # For each user ID, get their username and promote to admin via Gitea API
              for USER_ID in $MEMBERS; do
                echo "Processing user ID: $USER_ID"
                USERNAME=$(curl -s -H "Authorization: Bearer $AUTHENTIK_TOKEN" \
                  "$AUTHENTIK_URL/api/v3/core/users/$USER_ID/" | \
                  jq -r '.username')

                if [ -n "$USERNAME" ] && [ "$USERNAME" != "null" ]; then
                  echo "Promoting user $USERNAME to admin in Gitea..."

                  # Use Gitea API to promote user to admin
                  RESPONSE=$(curl -s -w "\n%{http_code}" \
                    -X PATCH \
                    -H "Authorization: token $GITEA_ADMIN_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{"admin": true}' \
                    "$GITEA_URL/api/v1/admin/users/$USERNAME" 2>&1)

                  HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

                  if [ "$HTTP_CODE" = "200" ]; then
                    echo "Successfully promoted $USERNAME to admin"
                  elif [ "$HTTP_CODE" = "404" ]; then
                    echo "Warning: User $USERNAME does not exist in Gitea yet"
                  else
                    echo "Warning: Failed to promote $USERNAME (HTTP $HTTP_CODE)"
                  fi
                fi
              done

              echo "Group sync completed"
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-group-sync
  namespace: gitea
