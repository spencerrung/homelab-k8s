---
# CronJob to sync Authentik group membership to Gitea admin privileges
# Users in the gitea-admins group in Authentik are automatically promoted to admins in Gitea
# Runs every 15 minutes to keep permissions in sync

apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-group-sync
  namespace: gitea
spec:
  schedule: "*/15 * * * *"  # Run every 15 minutes
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: gitea-group-sync
          containers:
          - name: sync
            image: alpine:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authentik-api-token
                  key: authentik_token
            - name: AUTHENTIK_URL
              value: "https://auth.alucard.dev"
            command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "Installing kubectl and curl..."
              apk add --no-cache curl kubectl

              GITEA_POD=$(kubectl get pods -n gitea -l app.kubernetes.io/name=gitea -o jsonpath='{.items[0].metadata.name}')

              if [ -z "$GITEA_POD" ]; then
                echo "Error: Could not find Gitea pod"
                exit 1
              fi

              echo "Syncing Authentik gitea-admins group to Gitea admins"
              echo "Using Gitea pod: $GITEA_POD"

              # Query Authentik API for gitea-admins group members
              echo "Querying Authentik for gitea-admins group members..."
              MEMBERS=$(curl -s -H "Authorization: Bearer $AUTHENTIK_TOKEN" \
                "$AUTHENTIK_URL/api/v3/core/groups/?name=gitea-admins" | \
                grep -o '"users":\[[^]]*\]' | grep -o '[0-9]\+' || echo "")

              if [ -z "$MEMBERS" ]; then
                echo "No members found in gitea-admins group or group doesn't exist yet"
                exit 0
              fi

              echo "Found user IDs: $MEMBERS"

              # For each user ID, get their username and promote to admin
              for USER_ID in $MEMBERS; do
                echo "Processing user ID: $USER_ID"
                USERNAME=$(curl -s -H "Authorization: Bearer $AUTHENTIK_TOKEN" \
                  "$AUTHENTIK_URL/api/v3/core/users/$USER_ID/" | \
                  grep -o '"username":"[^"]*"' | cut -d'"' -f4)

                if [ -n "$USERNAME" ]; then
                  echo "Promoting user $USERNAME to admin in Gitea..."
                  kubectl exec -n gitea "$GITEA_POD" -c gitea -- \
                    gitea admin user change-access-mode -u "$USERNAME" --admin 2>/dev/null || \
                    echo "Warning: Could not promote $USERNAME (user may not exist in Gitea yet)"
                fi
              done

              echo "Group sync completed"
          restartPolicy: OnFailure
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitea-group-sync
  namespace: gitea
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gitea-group-sync
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitea-group-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitea-group-sync
subjects:
- kind: ServiceAccount
  name: gitea-group-sync
  namespace: gitea
