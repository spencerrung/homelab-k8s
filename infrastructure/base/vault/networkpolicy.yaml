---
# Vault API reachable only from ESO (the ClusterSecretStore's home
# namespace) and from within the vault namespace (snapshot CronJob,
# kubectl exec debugging goes through the API server, not the pod net).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-ingress
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
        - podSelector: {}
      ports:
        - port: 8200
          protocol: TCP
