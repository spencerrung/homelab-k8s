---
# Nightly raft snapshot shipped to Backblaze B2, 01:30 UTC (before the
# 02:00 Velero run). Auth is via the k8s-auth role 'vault-snapshot'
# created by bootstrap/vault-init.sh; B2 retention is a bucket lifecycle
# rule (delete after 30 days). The snapshot step retries transient Vault
# unavailability so a brief restart does not consume the night's backup.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-b2-credentials
  namespace: vault
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vault-b2-credentials
    creationPolicy: Owner
  data:
    - secretKey: key_id
      remoteRef:
        key: backup/vault-b2
        property: key_id
    - secretKey: application_key
      remoteRef:
        key: backup/vault-b2
        property: application_key
    - secretKey: bucket
      remoteRef:
        key: backup/vault-b2
        property: bucket
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: vault
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: Never
          initContainers:
            - name: snapshot
              image: hashicorp/vault:2.0.3
              command:
                - sh
                - -ec
                - |
                  for attempt in $(seq 1 45); do
                    if ! token=$(vault write -field=token auth/kubernetes/login \
                      role=vault-snapshot \
                      jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"); then
                      echo "Vault authentication attempt ${attempt}/45 failed; retrying in 15s"
                      sleep 15
                      continue
                    fi
                    export VAULT_TOKEN="$token"
                    if vault operator raft snapshot save /snap/vault.snap; then
                      ls -la /snap/vault.snap
                      exit 0
                    fi
                    rm -f /snap/vault.snap
                    echo "Vault snapshot attempt ${attempt}/45 failed; retrying in 15s"
                    sleep 15
                  done
                  echo "Vault snapshot failed after 45 attempts" >&2
                  exit 1
              env:
                - name: VAULT_ADDR
                  value: http://vault.vault.svc.cluster.local:8200
              volumeMounts:
                - name: snap
                  mountPath: /snap
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          containers:
            - name: upload
              image: rclone/rclone:1.74.3
              command:
                - sh
                - -ec
                - |
                  # --s3-no-check-bucket: bucket-scoped B2 keys cannot list
                  # buckets, so rclone would otherwise try CreateBucket (403)
                  rclone copyto /snap/vault.snap \
                    ":s3:${BUCKET}/vault-$(date -u +%Y%m%d-%H%M%S).snap" \
                    --s3-provider Other \
                    --s3-endpoint "https://${ENDPOINT}" \
                    --s3-env-auth \
                    --s3-no-check-bucket
                  echo "uploaded; recent snapshots:"
                  rclone lsl ":s3:${BUCKET}" --s3-provider Other \
                    --s3-endpoint "https://${ENDPOINT}" --s3-env-auth | tail -5
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: vault-b2-credentials
                      key: key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vault-b2-credentials
                      key: application_key
                - name: BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: vault-b2-credentials
                      key: bucket
                - name: ENDPOINT
                  value: s3.us-west-004.backblazeb2.com
              volumeMounts:
                - name: snap
                  mountPath: /snap
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: snap
              emptyDir: {}
