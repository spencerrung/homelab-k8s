---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: '>=0.28.0'
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
      interval: 12h
  values:
    # Global settings for ARM64 (Raspberry Pi)
    global:
      enabled: true

    # Standalone mode for homelab (single instance)
    server:
      # ARM64 image configuration
      image:
        repository: hashicorp/vault
        tag: "1.15.6"
        pullPolicy: IfNotPresent

      # Run in dev mode for easy setup (WARNING: not for production!)
      # Remove this and configure proper storage for production use
      dev:
        enabled: false

      # HA mode disabled for homelab
      ha:
        enabled: false

      # Standalone mode with file storage
      standalone:
        enabled: true
        config: |
          ui = true

          listener "tcp" {
            tls_disable = 1
            address = "[::]:8200"
            cluster_address = "[::]:8201"
          }

          storage "file" {
            path = "/vault/data"
          }

      # Resource limits for Raspberry Pi
      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 512Mi
          cpu: 500m

      # Data persistence
      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: null  # Use default storage class

      # Enable service
      service:
        enabled: true
        type: ClusterIP
        port: 8200

    # UI configuration
    ui:
      enabled: true
      serviceType: ClusterIP

    # Injector for automatic secret injection (optional)
    injector:
      enabled: true
      image:
        repository: hashicorp/vault-k8s
        tag: "1.4.1"
        pullPolicy: IfNotPresent
      agentImage:
        repository: hashicorp/vault
        tag: "1.15.6"
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 100m
