---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: '0.34.0'
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
      interval: 12h
  values:
    server:
      image:
        repository: hashicorp/vault
        tag: "2.0.3"

      dev:
        enabled: false

      standalone:
        enabled: false

      # Production mode: single-node raft on a PVC. Raft (vs file storage)
      # gives us `vault operator raft snapshot` for backups. Manual unseal
      # after any pod restart:
      #   VAULT_UNSEAL_KEY=... bootstrap/vault-init.sh
      ha:
        enabled: true
        replicas: 1
        raft:
          enabled: true
          setNodeId: true

      # local-path storage is node-local, so the pod must always land on
      # the node that holds the PVC data
      nodeSelector:
        kubernetes.io/hostname: pi-03

      dataStorage:
        enabled: true
        size: 5Gi

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    injector:
      enabled: false
