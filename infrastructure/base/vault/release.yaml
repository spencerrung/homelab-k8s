---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: '>=0.28.0'
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
      interval: 12h
  values:
    server:
      image:
        repository: hashicorp/vault
        tag: "1.15.6"

      # Simple dev mode - auto-init, auto-unseal
      dev:
        enabled: true
        devRootToken: "root"

      # Disable injector to keep it simple
    injector:
      enabled: false
