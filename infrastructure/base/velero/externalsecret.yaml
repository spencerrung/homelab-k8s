---
# B2 application key for Velero, rendered into the aws-style credentials
# file the chart's credentials.existingSecret expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-b2-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: velero-b2-credentials
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .key_id }}
          aws_secret_access_key={{ .application_key }}
  data:
    - secretKey: key_id
      remoteRef:
        key: backup/velero-b2
        property: key_id
    - secretKey: application_key
      remoteRef:
        key: backup/velero-b2
        property: application_key
