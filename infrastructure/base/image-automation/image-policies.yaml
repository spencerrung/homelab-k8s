---
# Policy names must match the {"$imagepolicy": "flux-system:<name>"}
# markers in the app deployments. Tags are <UTC ts>-<short sha> from the
# Tekton generate-tag task; newest timestamp wins.
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: alucard-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: alucard-web
  filterTags:
    pattern: '^(?P<ts>\d{14})-[a-f0-9]+$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
