---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  validationFailureAction: Audit
  background: false
  rules:
    - name: liveness-and-readiness
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
      validate:
        message: "Liveness and readiness probes are required on long-running workloads."
        foreach:
          - list: request.object.spec.template.spec.containers[]
            deny:
              conditions:
                any:
                  - key: "{{ element.livenessProbe || '' }}"
                    operator: Equals
                    value: ''
                  - key: "{{ element.readinessProbe || '' }}"
                    operator: Equals
                    value: ''
