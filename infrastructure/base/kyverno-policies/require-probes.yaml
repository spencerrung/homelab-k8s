apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
  validations:
  - expression: object.spec.template.spec.containers.all(c, has(c.livenessProbe) &&
      has(c.readinessProbe))
    message: Liveness and readiness probes are required on long-running workloads.
