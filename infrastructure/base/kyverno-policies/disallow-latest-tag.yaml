apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
    namespaceSelector:
      matchExpressions:
      - key: policy.alucard.dev/allow-latest
        operator: NotIn
        values:
        - 'true'
  validations:
  - expression: object.spec.containers.all(c, c.image.contains(':'))
    message: Images must carry an explicit tag.
  - expression: object.spec.containers.all(c, !c.image.endsWith(':latest'))
    message: Pin an explicit tag; :latest is not reproducible.
