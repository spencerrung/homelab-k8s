apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
      - replicationcontrollers
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    - apiGroups:
      - batch
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jobs
      - cronjobs
    namespaceSelector:
      matchExpressions:
      - key: policy.alucard.dev/allow-latest
        operator: NotIn
        values:
        - 'true'
  validations:
  - expression: variables.podSpec.containers.all(c, c.image.contains(':'))
    message: Images must carry an explicit tag.
  - expression: variables.podSpec.containers.all(c, !c.image.endsWith(':latest'))
    message: Pin an explicit tag; :latest is not reproducible.
  variables:
  - name: podSpec
    expression: 'object.kind == ''CronJob'' ? object.spec.jobTemplate.spec.template.spec
      : (object.kind == ''Pod'' ? object.spec : object.spec.template.spec)'
