---
# Grafana admin credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
---
# Matrix bot identity for matrix-alertmanager-receiver, injected as env
# vars; the (non-secret) config file lives in a ConfigMap and references
# them via ${...}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-alertmanager-receiver-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-alertmanager-receiver-secrets
    creationPolicy: Owner
  data:
    - secretKey: MATRIX_USER_ID
      remoteRef:
        key: monitoring/matrix
        property: user-id
    - secretKey: MATRIX_ACCESS_TOKEN
      remoteRef:
        key: monitoring/matrix
        property: access-token
    - secretKey: MATRIX_ROOM_ID
      remoteRef:
        key: monitoring/matrix
        property: room-id
