---
# Grafana admin credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring/grafana
        property: admin-password
---
# Full config file for matrix-alertmanager-receiver, rendered from Vault so
# the bot access token stays out of git. Alertmanager posts to
# /alerts/homelab; room-mapping resolves that to the real room ID.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-alertmanager-receiver-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-alertmanager-receiver-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          http:
            address: 0.0.0.0
            port: 8080
          matrix:
            homeserver-url: http://synapse.matrix.svc.cluster.local:8008
            user-id: "{{ .user_id }}"
            access-token: "{{ .access_token }}"
            room-mapping:
              homelab: "{{ .room_id }}"
  data:
    - secretKey: user_id
      remoteRef:
        key: monitoring/matrix
        property: user-id
    - secretKey: access_token
      remoteRef:
        key: monitoring/matrix
        property: access-token
    - secretKey: room_id
      remoteRef:
        key: monitoring/matrix
        property: room-id
