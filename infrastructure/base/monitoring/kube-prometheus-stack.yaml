---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '87.10.1'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 12h
  values:
    # k3s runs the whole control plane in one process: the separate
    # scheduler/controller-manager/kube-proxy metric ports don't exist as
    # scrapable endpoints (their metrics are folded into the apiserver's),
    # and single-server k3s uses sqlite, not etcd. Leaving these enabled
    # means permanently-red targets and alerts.
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    defaultRules:
      rules:
        etcd: false
        kubeScheduler: false
        kubeControllerManager: false
        kubeProxy: false
        # consumers of the apiserver histogram buckets dropped below
        kubeApiserverSlos: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false

    # ~110k of 245k series were apiserver/etcd latency histogram buckets
    # feeding SLO dashboards nobody reads on a homelab - drop at scrape
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            sourceLabels: [__name__]
            regex: (apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|etcd_request_duration_seconds_bucket)

    # k3s twist: the single-binary kubelet endpoint serves the apiserver
    # metric surface too, so the same drop must guard this door
    kubelet:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            sourceLabels: [__name__]
            regex: (apiserver_request_duration_seconds_bucket|apiserver_request_sli_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket|etcd_request_duration_seconds_bucket)

    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 8GB
        # Without these the operator only picks up monitors deployed by
        # this chart itself - flux/traefik/cert-manager monitors would be
        # silently ignored
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # local-path PVC is node-local; pin so pod and data stay together
        nodeSelector:
          kubernetes.io/hostname: pi-05
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 15Gi
        resources:
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            memory: 1536Mi

    alertmanager:
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 96Mi
      config:
        route:
          receiver: matrix
          group_by:
            - alertname
            - namespace
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            # meta-alerts that exist only for machinery, never for humans
            - receiver: 'null'
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
        # standard kube-prometheus-stack inhibitions (dropped when we
        # overrode config wholesale): higher severity in a namespace mutes
        # lower, and info alerts stay hidden unless InfoInhibitor clears
        inhibit_rules:
          - source_matchers:
              - severity = critical
            target_matchers:
              - severity =~ warning|info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - severity = warning
            target_matchers:
              - severity = info
            equal:
              - namespace
              - alertname
          - source_matchers:
              - alertname = InfoInhibitor
            target_matchers:
              - severity = info
            equal:
              - namespace
        receivers:
          - name: 'null'
          - name: matrix
            webhook_configs:
              - url: http://matrix-alertmanager-receiver.monitoring.svc:8080/alerts/homelab
                send_resolved: true

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      sidecar:
        dashboards:
          enabled: true
          searchNamespace: ALL
      # Dashboards fetched from grafana.com at pod start (revisions verified
      # to exist; a bad revision fails the pod)
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: default
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
      dashboards:
        default:
          node-exporter-full:
            gnetId: 1860
            revision: 45
            datasource: Prometheus
          flux2:
            gnetId: 16714
            revision: 1
            datasource: Prometheus
          cert-manager:
            gnetId: 11001
            revision: 1
            datasource: Prometheus
          traefik:
            gnetId: 17346
            revision: 9
            datasource: Prometheus
          loki-logs:
            gnetId: 13639
            revision: 2
            datasource: Loki
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi

    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi

    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 48Mi
