---
# NFS CSI driver for mounting UNAS exports. Static PVs only for now - the
# NAS exports specific paths, so there is no parent share for dynamic
# provisioning.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: '4.13.4'
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
      interval: 12h
  values:
    controller:
      replicas: 1
      resources:
        csiProvisioner:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            memory: 128Mi
        nfs:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            memory: 128Mi
    node:
      resources:
        nfs:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            memory: 128Mi
