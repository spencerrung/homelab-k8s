---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: 'v1.20.3'
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: flux-system
      interval: 12h
  values:
    # Install CRDs with the chart
    installCRDs: true

    # LAN DNS returned NXDOMAIN for publicly visible ACME TXT records,
    # including queries addressed to public/authoritative servers on port 53.
    # Use DoH for DNS01 discovery and self-checks, without changing app DNS.
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=https://1.1.1.1/dns-query,https://8.8.8.8/dns-query

    # Resource limits for Raspberry Pi
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi

    webhook:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

    cainjector:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 192Mi

    # Prometheus metrics, scraped via ServiceMonitor (Phase 3 monitoring)
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
