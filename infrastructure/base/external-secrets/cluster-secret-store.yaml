---
# Single cluster-wide Vault store, replacing the per-namespace
# SecretStore/ServiceAccount copies. All ExternalSecrets reference this via
# secretStoreRef.kind: ClusterSecretStore. The Vault k8s-auth role
# 'external-secrets' is bound to exactly this ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
