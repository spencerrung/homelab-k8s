---
# Example ExternalSecret that syncs from Vault to Kubernetes
# This file is for reference only - not applied by default
#
# This will:
# 1. Read secret data from Vault path: secret/data/myapp/config
# 2. Create a Kubernetes Secret in the same namespace
# 3. Automatically update the Secret when Vault data changes
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: myapp-secrets
  namespace: default  # Change to your app namespace
spec:
  # Refresh interval
  refreshInterval: 1h

  # Reference to SecretStore
  secretStoreRef:
    name: vault-backend
    kind: SecretStore

  # Target Kubernetes Secret
  target:
    name: myapp-secrets
    creationPolicy: Owner

  # Data to sync from Vault
  data:
    # Single key example
    - secretKey: database-password  # Key in K8s Secret
      remoteRef:
        key: myapp/config           # Path in Vault (secret/data/myapp/config)
        property: db_password       # Field in Vault secret

    # Another example
    - secretKey: api-key
      remoteRef:
        key: myapp/config
        property: api_key

  # Or sync all keys from a Vault path
  # dataFrom:
  #   - extract:
  #       key: myapp/config  # All fields from this path
