---
# Example SecretStore connecting ESO to Vault
# This file is for reference only - not applied by default
#
# To use:
# 1. Ensure Vault is initialized and unsealed
# 2. Create a Kubernetes auth backend in Vault
# 3. Create a service account token for ESO to authenticate
# 4. Apply this SecretStore to your namespace
#
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: default  # Change to your app namespace
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"  # KV v2 mount path
      version: "v2"   # KV version
      auth:
        # Kubernetes auth method
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"  # Vault role name
          serviceAccountRef:
            name: external-secrets-sa  # ServiceAccount in this namespace
---
# Example ServiceAccount for ESO authentication
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: default  # Change to your app namespace
