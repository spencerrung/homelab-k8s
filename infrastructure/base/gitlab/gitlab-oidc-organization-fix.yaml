---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-oidc-organization-fix
  namespace: gitlab
data:
  fix_oidc_organization.rb: |
    # Fix for GitLab 18.x OIDC authentication with no organization context
    # Issue: Current.organization is nil during OIDC callback
    Rails.application.config.to_prepare do
      OmniauthCallbacksController.class_eval do
        def build_auth_user_params
          org_id = if Current.organization
                     Current.organization.id
                   else
                     # Fallback to first organization if Current.organization is not set
                     Organizations::Organization.first&.id || 1000
                   end
          { organization_id: org_id }
        end
      end
    end
