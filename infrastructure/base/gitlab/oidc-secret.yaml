---
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-oidc
  namespace: gitlab
type: Opaque
stringData:
  provider: |
    name: openid_connect
    label: Authentik
    args:
      name: openid_connect
      scope:
        - openid
        - profile
        - email
      response_type: code
      issuer: https://auth.alucard.dev/application/o/gitlab/
      discovery: true
      client_auth_method: query
      uid_field: preferred_username
      send_scope_to_token_endpoint: false
      pkce: true
      client_options:
        identifier: PLACEHOLDER_CLIENT_ID
        secret: PLACEHOLDER_CLIENT_SECRET
        redirect_uri: https://code.alucard.dev/users/auth/openid_connect/callback
