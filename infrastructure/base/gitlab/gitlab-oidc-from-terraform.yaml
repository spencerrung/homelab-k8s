---
# ExternalSecret to sync GitLab OIDC credentials from Vault
#
# OIDC Provider Management:
#   - Authentik OAuth2 provider is managed by: infrastructure/base/authentik/gitlab-oidc-blueprint.yaml
#   - Credentials (client_id, client_secret) are stored in Vault at: secret/gitlab-oidc
#
# This ExternalSecret:
#   - Pulls client_id and client_secret from Vault
#   - Templates them into the full provider config that GitLab expects
#   - Creates the gitlab-oidc secret with a 'provider' key containing the complete YAML
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-oidc
  namespace: gitlab
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: gitlab-oidc
    creationPolicy: Owner
    template:
      data:
        # Static OIDC configuration with dynamic secrets injected from Vault
        provider: |
          name: openid_connect
          label: Authentik
          args:
            name: openid_connect
            scope:
              - openid
              - profile
              - email
            response_type: code
            issuer: https://auth.alucard.dev/application/o/gitlab/
            discovery: true
            uid_field: preferred_username
            client_options:
              identifier: {{ .client_id }}
              secret: {{ .client_secret }}
              redirect_uri: https://code.alucard.dev/users/auth/openid_connect/callback
  data:
    - secretKey: client_id
      remoteRef:
        key: gitlab-oidc
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: gitlab-oidc
        property: client_secret
