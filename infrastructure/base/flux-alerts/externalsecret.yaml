---
# Matrix bot token for the Flux notification-controller Provider.
# Reuses the @alertmanager bot created for Alertmanager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-matrix-token
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: flux-matrix-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: monitoring/matrix
        property: access-token
