---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tf-controller
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: tofu-controller
      version: '0.16.0-rc.5'
      sourceRef:
        kind: HelmRepository
        name: tofu-controller
        namespace: flux-system
      interval: 12h
  values:
    # Controller image (supports ARM64) - now under flux-iac org
    image:
      repository: ghcr.io/flux-iac/tofu-controller
      tag: v0.16.0-rc.5
      pullPolicy: IfNotPresent

    # Resource limits for Raspberry Pi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # Runner pod resources (pods that run terraform)
    runner:
      image:
        repository: ghcr.io/flux-iac/tf-runner
        tag: v0.16.0-rc.5
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 1000m
          memory: 1Gi

    # Install CRDs
    installCRDs: true

    # Concurrency settings
    concurrency: 2

    # Metrics
    metrics:
      enabled: true

    # Enable branch planner (optional - for PR automation)
    branchPlanner:
      enabled: false

    # Log level
    logLevel: info

    # Service account
    serviceAccount:
      create: true
      name: tf-controller
