---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release-pipelines.yaml
  - release-triggers.yaml
  - release-interceptors.yaml
  - release-dashboard.yaml
  - ingress.yaml
  - pipelines/
patches:
  # Set PodSecurity to baseline (not restricted) for Tekton workloads
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: tekton-pipelines
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/audit: baseline
          pod-security.kubernetes.io/warn: baseline
    target:
      kind: Namespace
      name: tekton-pipelines
  # Reduce resource requests for homelab environment
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tekton-pipelines-controller
        namespace: tekton-pipelines
      spec:
        template:
          spec:
            containers:
            - name: tekton-pipelines-controller
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
    target:
      kind: Deployment
      name: tekton-pipelines-controller
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tekton-dashboard
        namespace: tekton-pipelines
      spec:
        template:
          spec:
            containers:
            - name: tekton-dashboard
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
    target:
      kind: Deployment
      name: tekton-dashboard
