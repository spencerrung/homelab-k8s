---
# SecretStore for tekton-pipelines namespace to access Vault
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: tekton-pipelines
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets-sa
---
# ServiceAccount for External Secrets in tekton-pipelines namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: tekton-pipelines
