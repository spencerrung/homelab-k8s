---
# External Secret to sync Gitea token from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-registry-credentials
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: gitea-docker-credentials
    creationPolicy: Owner
    template:
      data:
        config.json: |
          {
            "auths": {
              "code.alucard.dev": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: gitea/registry-credentials
        property: username
    - secretKey: token
      remoteRef:
        key: gitea/registry-credentials
        property: token
---
# ServiceAccount for running Tekton pipelines
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build-sa
  namespace: tekton-pipelines
secrets:
  - name: gitea-docker-credentials
