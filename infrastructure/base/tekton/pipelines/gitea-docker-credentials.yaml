---
# NOTE: the gitea-registry-credentials ExternalSecret was removed. Its Vault
# path (secret/gitea/registry-credentials) was lost in the ~2026-01 Vault data
# loss and the target secret is gone, so it can't be recovered from the live
# cluster. Re-add it (regenerate a Gitea registry token, seed Vault) when
# restoring Tekton CI image pushes.
---
# ServiceAccount for running Tekton pipelines
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build-sa
  namespace: tekton-pipelines
secrets:
  - name: gitea-docker-credentials
