---
# Docker Hub push credentials for kaniko, rendered as the config.json the
# DOCKER_CONFIG env expects. Docker Hub is the deploy registry (not the
# in-cluster Gitea registry) so images survive cluster loss.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockerhub-docker-credentials
  namespace: tekton-pipelines
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: dockerhub-docker-credentials
    creationPolicy: Owner
    template:
      data:
        config.json: |
          {"auths":{"https://index.docker.io/v1/":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: dockerhub/robot
        property: username
    - secretKey: token
      remoteRef:
        key: dockerhub/robot
        property: token
---
# ServiceAccount for running Tekton pipelines
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-build-sa
  namespace: tekton-pipelines
secrets:
  - name: dockerhub-docker-credentials
