---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/version: "0.7"
spec:
  description: >-
    Build and push container images using Kaniko (no privileged mode required)
  params:
    - name: IMAGE
      description: Reference of the image kaniko will produce
    - name: DOCKERFILE
      description: Path to the Dockerfile to build
      default: ./Dockerfile
    - name: CONTEXT
      description: Path to the directory to use as context
      default: .
    - name: FORMAT
      description: The format of the built container (oci or docker)
      default: "oci"
    - name: TLSVERIFY
      description: Verify the TLS on the registry endpoint
      type: string
      default: "true"
  workspaces:
    - name: source
    - name: dockerconfig
      description: Docker config for authentication
      optional: true
  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.0
      workingDir: $(workspaces.source.path)
      env:
        - name: DOCKER_CONFIG
          value: $(workspaces.dockerconfig.path)
      script: |
        #!/bin/sh
        set -e

        # Extract the registry and image name from the full image reference
        IMAGE_BASE=$(echo "$(params.IMAGE)" | cut -d':' -f1)

        # Build and push with both commit SHA and latest tags
        /kaniko/executor \
          --dockerfile=$(params.DOCKERFILE) \
          --context=$(workspaces.source.path)/$(params.CONTEXT) \
          --destination=$(params.IMAGE) \
          --destination=${IMAGE_BASE}:latest \
          --insecure \
          --insecure-pull \
          --cache=false

        echo "Pushed image with tags:"
        echo "  - $(params.IMAGE)"
        echo "  - ${IMAGE_BASE}:latest"
