---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/version: "0.9"
spec:
  description: >-
    Clone a git repository from Gitea
  params:
    - name: url
      description: Repository URL to clone from
      type: string
    - name: revision
      description: Revision to checkout (branch, tag, sha, ref)
      type: string
      default: "main"
    - name: subdirectory
      description: Subdirectory inside the workspace to clone the repo
      type: string
      default: ""
  workspaces:
    - name: output
      description: The git repo will be cloned onto this workspace
  steps:
    - name: clone
      image: alpine/git:latest
      workingDir: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -eu

        CHECKOUT_DIR="$(workspaces.output.path)/$(params.subdirectory)"

        # Clone the repository
        git clone "$(params.url)" "${CHECKOUT_DIR}"
        cd "${CHECKOUT_DIR}"

        # Checkout the specific revision
        git checkout "$(params.revision)"

        # Get the actual commit SHA
        RESULT_SHA="$(git rev-parse HEAD)"
        echo -n "${RESULT_SHA}" > $(results.commit.path)

        echo "Successfully cloned $(params.url) at revision $(params.revision)"
        echo "Commit SHA: ${RESULT_SHA}"
  results:
    - name: commit
      description: The commit SHA that was fetched
