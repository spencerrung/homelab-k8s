---
apiVersion: v1
kind: ConfigMap
metadata:
  name: username-scope-mapping-blueprint
  namespace: authentik
  labels:
    blueprints.goauthentik.io/instantiate: "true"
data:
  username-scope-mapping.yaml: |
    version: 1
    metadata:
      name: Username Property Mapping
    entries:
      # Custom property mapping to add preferred_username to OIDC tokens
      - model: authentik_providers_oauth2.scopepropertymapping
        identifiers:
          name: username-property-mapping
        attrs:
          scope_name: profile
          description: "Add preferred_username and nickname claims"
          expression: |
            return {
              "preferred_username": user.username,
              "nickname": user.username,
            }
