---
# PostgreSQL credentials from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-postgresql
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: authentik-postgresql
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: authentik/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: authentik/postgresql
        property: password
---
# Authentik secret key from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secret-key
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: authentik-secret-key
    creationPolicy: Owner
  data:
    - secretKey: secret_key
      remoteRef:
        key: authentik/secret-key
        property: secret_key
