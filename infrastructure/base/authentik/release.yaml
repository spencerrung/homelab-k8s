---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: '>=2024.8.0'
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  dependsOn:
    - name: tf-controller
      namespace: flux-system
  values:
    # Global settings
    global:
      image:
        repository: ghcr.io/goauthentik/server
        tag: 2024.8.3
        pullPolicy: IfNotPresent

      # Environment URLs - update these for your domain
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret-key
              key: secret_key
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
          value: "true"
        - name: AUTHENTIK_AVATARS
          value: "gravatar,initials"
        # CSRF trusted origins - required for form submissions (comma-separated list)
        - name: AUTHENTIK_WEB__CSRF_TRUSTED_ORIGINS
          value: "https://auth.alucard.dev,"
        # PostgreSQL configuration via environment variables
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "postgresql.authentik.svc.cluster.local"
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-postgresql
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgresql
              key: password

    # Use external PostgreSQL
    postgresql:
      enabled: false

    # Redis configuration (embedded for simplicity)
    redis:
      enabled: true
      master:
        persistence:
          enabled: true
          size: 1Gi
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 512m
            memory: 256Mi

    # Server configuration
    server:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 2
          memory: 1Gi

      ingress:
        enabled: false  # Enable later with Traefik/nginx
        # Will configure this when setting up ingress controller

    # Worker configuration
    worker:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 2
          memory: 1Gi
