---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: '2026.5.3'
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      interval: 12h
  dependsOn:
    - name: tf-controller
      namespace: flux-system
  values:
    # Global settings
    global:
      image:
        repository: ghcr.io/goauthentik/server
        tag: 2025.10.0
        pullPolicy: IfNotPresent

      # Environment URLs - update these for your domain
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret-key
              key: secret_key
        - name: AUTHENTIK_ERROR_REPORTING__ENABLED
          value: "false"
        - name: AUTHENTIK_DISABLE_UPDATE_CHECK
          value: "true"
        - name: AUTHENTIK_DISABLE_STARTUP_ANALYTICS
          value: "true"
        - name: AUTHENTIK_AVATARS
          value: "gravatar,initials"
        # CSRF trusted origins - required for form submissions (comma-separated list)
        - name: AUTHENTIK_WEB__CSRF_TRUSTED_ORIGINS
          value: "https://auth.alucard.dev,"
        # PostgreSQL configuration via environment variables
        - name: AUTHENTIK_POSTGRESQL__HOST
          value: "postgresql.authentik.svc.cluster.local"
        - name: AUTHENTIK_POSTGRESQL__PORT
          value: "5432"
        - name: AUTHENTIK_POSTGRESQL__NAME
          value: "authentik"
        - name: AUTHENTIK_POSTGRESQL__USER
          valueFrom:
            secretKeyRef:
              name: authentik-postgresql
              key: username
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgresql
              key: password

    # Use external PostgreSQL
    postgresql:
      enabled: false

    # Redis configuration - DISABLED as of v2025.10.0 (Redis completely removed)
    # All Redis functionality has been migrated to PostgreSQL
    redis:
      enabled: false

    # Server configuration
    server:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1.5Gi

      ingress:
        enabled: false  # Enable later with Traefik/nginx
        # Will configure this when setting up ingress controller

      # Mount custom blueprints
      volumes:
        - name: gitea-oidc-blueprint
          configMap:
            name: gitea-oidc-blueprint
        - name: users-groups-blueprint
          configMap:
            name: users-groups-blueprint
        - name: username-scope-mapping-blueprint
          configMap:
            name: username-scope-mapping-blueprint
      volumeMounts:
        - name: gitea-oidc-blueprint
          mountPath: /blueprints/custom/gitea-oidc.yaml
          subPath: gitea-oidc.yaml
          readOnly: true
        - name: users-groups-blueprint
          mountPath: /blueprints/custom/users-groups.yaml
          subPath: users-groups.yaml
          readOnly: true
        - name: username-scope-mapping-blueprint
          mountPath: /blueprints/custom/username-scope-mapping.yaml
          subPath: username-scope-mapping.yaml
          readOnly: true

    # Worker configuration
    worker:
      replicas: 2
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 1.5Gi

      # Disable health checks for workers entirely
      # Workers run background tasks, don't expose HTTP endpoints
      # Standard utilities (ps, pgrep) aren't available in minimal container
      # Container will be restarted by Kubernetes if it crashes
      livenessProbe: null
      readinessProbe: null
      startupProbe: null

      # Mount custom blueprints
      volumes:
        - name: gitea-oidc-blueprint
          configMap:
            name: gitea-oidc-blueprint
        - name: users-groups-blueprint
          configMap:
            name: users-groups-blueprint
        - name: username-scope-mapping-blueprint
          configMap:
            name: username-scope-mapping-blueprint
      volumeMounts:
        - name: gitea-oidc-blueprint
          mountPath: /blueprints/custom/gitea-oidc.yaml
          subPath: gitea-oidc.yaml
          readOnly: true
        - name: users-groups-blueprint
          mountPath: /blueprints/custom/users-groups.yaml
          subPath: users-groups.yaml
          readOnly: true
        - name: username-scope-mapping-blueprint
          mountPath: /blueprints/custom/username-scope-mapping.yaml
          subPath: username-scope-mapping.yaml
          readOnly: true
