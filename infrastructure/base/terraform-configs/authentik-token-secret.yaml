---
# ExternalSecret to sync Authentik API token from Vault
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-terraform-vars
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: authentik-terraform-vars
    creationPolicy: Owner
    template:
      data:
        authentik_token: "{{ .apiToken }}"
  data:
    - secretKey: apiToken
      remoteRef:
        key: authentik/terraform-token
        property: api-token
