---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/sources
  - ../../base/tf-controller
  - ../../base/vault  # Use base vault (dev mode, no auto-unseal)
  - ../../base/external-secrets  # Re-enabled now that Vault is configured!
  - ../../base/terraform-configs  # Terraform configurations (Authentik OIDC, etc.)
  - ../../base/cert-manager  # TLS certificate management
  - ../../base/traefik  # In-cluster ingress controller
  - ../../base/authentik  # OIDC identity provider
  - ../../base/gitea  # Lightweight Git hosting with a cup of tea
  # - ../../base/gitlab  # Git repository and CI/CD platform (disabled - switching to Gitea)
# Add homelab-specific patches and resources here
# Note: cert-manager-issuers is deployed via separate Flux Kustomization in clusters/homelab/cert-manager-issuers.yaml
