---
# Patch to add auto-unseal init container to Vault
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  values:
    server:
      # Add post-start lifecycle hook for auto-unseal
      postStart:
        - /bin/sh
        - -c
        - |
          sleep 10
          if [ -f /vault/unseal-keys/key1 ]; then
            vault operator unseal $(cat /vault/unseal-keys/key1) || true
            vault operator unseal $(cat /vault/unseal-keys/key2) || true
            vault operator unseal $(cat /vault/unseal-keys/key3) || true
          fi

      # Mount unseal keys secret
      volumes:
        - name: unseal-keys
          secret:
            secretName: vault-unseal-keys
            optional: true

      volumeMounts:
        - name: unseal-keys
          mountPath: /vault/unseal-keys
          readOnly: true

      # Add auto-unseal as a sidecar
      extraContainers:
        - name: auto-unseal
          image: hashicorp/vault:1.15.6
          command:
            - /bin/sh
            - -c
            - |
              #!/bin/sh
              set -e

              echo "Auto-unseal sidecar started"

              while true; do
                sleep 30

                # Check if vault is sealed
                STATUS=$(vault status -format=json 2>/dev/null || echo '{"sealed":true}')
                SEALED=$(echo "$STATUS" | grep -o '"sealed":[^,}]*' | cut -d':' -f2 | tr -d ' ')

                if [ "$SEALED" = "true" ]; then
                  echo "Vault is sealed, attempting to unseal..."

                  if [ -f /vault/unseal-keys/key1 ]; then
                    vault operator unseal $(cat /vault/unseal-keys/key1) 2>/dev/null || true
                    sleep 2
                    vault operator unseal $(cat /vault/unseal-keys/key2) 2>/dev/null || true
                    sleep 2
                    vault operator unseal $(cat /vault/unseal-keys/key3) 2>/dev/null || true
                    echo "Unseal attempt completed"
                  else
                    echo "Unseal keys not found, skipping auto-unseal"
                  fi
                fi
              done
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
          volumeMounts:
            - name: unseal-keys
              mountPath: /vault/unseal-keys
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
