---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: breathe
  namespace: breathe
  annotations:
    # Use Traefik ingress class
    kubernetes.io/ingress.class: traefik
    # Use cert-manager to provision certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Allow both HTTP and HTTPS entrypoints (external Traefik handles TLS)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - breathe.alucard.dev
      secretName: breathe-tls
  rules:
    - host: breathe.alucard.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: breathe
                port:
                  number: 80
