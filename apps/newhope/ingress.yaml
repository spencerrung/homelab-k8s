---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: newhope
  namespace: newhope
  annotations:
    # Use Traefik ingress class
    kubernetes.io/ingress.class: traefik
    # Use cert-manager to provision certificate
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Allow both HTTP and HTTPS entrypoints (external Traefik handles TLS)
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - nh.alucard.dev
      secretName: newhope-tls
  rules:
    - host: nh.alucard.dev
      http:
        paths:
          # Blog engagement counter (views/hearts/stats)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: newhope-views
                port:
                  number: 8787
          - path: /
            pathType: Prefix
            backend:
              service:
                name: newhope-web
                port:
                  number: 80
