---
# Blog engagement counter (views + hearts) — JSON-file persistence on a small PVC.
# Single replica: the file store is not safe for concurrent writers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newhope-views
  namespace: newhope
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: newhope-views
  template:
    metadata:
      labels:
        app: newhope-views
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: views
          image: docker.io/spencerrung/newhope-views:latest # {"$imagepolicy": "flux-system:newhope-views"}
          ports:
            - containerPort: 8787
              name: http
          env:
            - name: ALLOW_ORIGIN
              value: https://nh.alucard.dev
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /stats?slugs=
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /stats?slugs=
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: newhope-views-data
