---
# HA /config on the UNAS NFS export. Note: the recorder SQLite DB lives
# here too - commit_interval is raised in the seeded configuration.yaml to
# soften NFS locking; if the recorder misbehaves, options are a local-path
# volume for /config or moving the recorder to postgres.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 10.10.10.62/volume/cb9d8e3a-aadf-446d-b16c-b701b8199c8c/.srv/.unifi-drive/homeassistant/.data
    volumeAttributes:
      server: 10.10.10.62
      share: /volume/cb9d8e3a-aadf-446d-b16c-b701b8199c8c/.srv/.unifi-drive/homeassistant/.data
  mountOptions:
    # UNAS serves NFSv3 only (no v4 pseudo-root); nolock keeps locks local
    # to the single client per volume, which is consistent for our use
    - nfsvers=3
    - nolock
    - noatime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
  namespace: home-assistant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: home-assistant-config
  resources:
    requests:
      storage: 10Gi
