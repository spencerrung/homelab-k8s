---
# hostNetwork for mDNS/SSDP device discovery; pinned to one node so the
# host IP integrations see stays stable (and any future Zigbee USB stick
# has a home - though an ethernet coordinator avoids that entirely).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: raspberrypi-d868c445
      initContainers:
        # Seed a minimal configuration.yaml on first boot; never touches an
        # existing one. trusted_proxies is required or every request
        # through traefik gets a 400.
        - name: seed-config
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -ec
            - |
              if [ ! -f /config/configuration.yaml ]; then
                cat > /config/configuration.yaml <<'EOF'
              default_config:

              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.42.0.0/16
                  - 10.10.10.0/24

              recorder:
                commit_interval: 30
                purge_keep_days: 14

              automation: !include automations.yaml
              script: !include scripts.yaml
              scene: !include scenes.yaml
              EOF
                touch /config/automations.yaml /config/scripts.yaml /config/scenes.yaml
                echo "seeded configuration.yaml"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      containers:
        - name: home-assistant
          image: ghcr.io/home-assistant/home-assistant:2026.7.1
          ports:
            - containerPort: 8123
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config
