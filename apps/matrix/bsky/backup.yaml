apiVersion: apps/v1
kind: Deployment
metadata:
  name: bsky-state-backup
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bsky-state-backup
  template:
    metadata:
      labels:
        app: bsky-state-backup
      annotations:
        backup.velero.io/backup-volumes: backup
        backup.velero.io/backup-volumes-excludes: data
        pre.hook.backup.velero.io/container: backup
        pre.hook.backup.velero.io/command: '["python", "-B", "/app/backup_state.py", "/data/state.sqlite3", "/backup/state.sqlite3"]'
        pre.hook.backup.velero.io/on-error: Fail
        pre.hook.backup.velero.io/timeout: 60s
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: python:3.12.16-alpine
          command: [python, -B, -c, "import signal, sys, time; signal.signal(signal.SIGTERM, lambda *_: sys.exit(0)); time.sleep(2147483647)"]
          readinessProbe:
            exec:
              command: [sh, -ec, "test -r /data/state.sqlite3"]
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            # Python probes/backup hooks burst briefly; a 100m CPU quota
            # throttled ~70-78% of active periods despite ~3m average CPU.
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
              readOnly: true
            - name: backup
              mountPath: /backup
      volumes:
        - name: code
          configMap:
            name: bsky-backup-code
        - name: data
          persistentVolumeClaim:
            claimName: bsky-notifier-data
            readOnly: true
        - name: backup
          emptyDir:
            sizeLimit: 1Gi
