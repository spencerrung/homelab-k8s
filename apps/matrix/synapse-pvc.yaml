---
# Persistent /data for Synapse: signing key, media store, logs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synapse-data
  namespace: matrix
  annotations:
    # Never allow Flux to prune this PVC - data is irreplaceable
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
