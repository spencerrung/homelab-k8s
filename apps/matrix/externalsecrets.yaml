---
# PostgreSQL credentials from Vault (consumed by the postgres StatefulSet)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: matrix-postgresql
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: matrix-postgresql
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: matrix/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: matrix/postgresql
        property: password
---
# Synapse secrets rendered into a homeserver config fragment (secrets.yaml).
# Kept separate from the ConfigMap so no secret ever lands in Git. Synapse is
# started with `-c homeserver.yaml -c secrets.yaml`, merging the two.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synapse-secrets
  namespace: matrix
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: synapse-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        secrets.yaml: |
          database:
            name: psycopg2
            args:
              user: "{{ .db_user }}"
              password: "{{ .db_password }}"
              dbname: synapse
              host: postgresql.matrix.svc.cluster.local
              port: 5432
              cp_min: 5
              cp_max: 10
          registration_shared_secret: "{{ .registration_shared_secret }}"
          macaroon_secret_key: "{{ .macaroon_secret_key }}"
          form_secret: "{{ .form_secret }}"
  data:
    - secretKey: db_user
      remoteRef:
        key: matrix/postgresql
        property: username
    - secretKey: db_password
      remoteRef:
        key: matrix/postgresql
        property: password
    - secretKey: registration_shared_secret
      remoteRef:
        key: matrix/synapse
        property: registration_shared_secret
    - secretKey: macaroon_secret_key
      remoteRef:
        key: matrix/synapse
        property: macaroon_secret_key
    - secretKey: form_secret
      remoteRef:
        key: matrix/synapse
        property: form_secret
