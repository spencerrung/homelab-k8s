---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinny
  namespace: matrix
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - cinny.alucard.dev
      secretName: matrix-cinny-tls
  rules:
    - host: cinny.alucard.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cinny
                port:
                  number: 80
