---
# Delegation + apex federation on alucard.dev:
#  - /.well-known/matrix/* -> static responder (points delegation at matrix.alucard.dev)
#  - /_matrix/*            -> Synapse directly, so remote servers that cached the
#                            OLD delegation (alucard.dev:443) can still fetch our
#                            signing key and federate instead of hitting the
#                            static website. Both prefixes are more specific than
#                            the `/` rule in apps/alucard-web/ingress.yaml, so the
#                            static site keeps serving everything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-wellknown
  namespace: matrix
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - alucard.dev
      secretName: matrix-wellknown-tls
  rules:
    - host: alucard.dev
      http:
        paths:
          - path: /.well-known/matrix/
            pathType: Prefix
            backend:
              service:
                name: matrix-wellknown
                port:
                  number: 80
          - path: /_matrix/
            pathType: Prefix
            backend:
              service:
                name: synapse
                port:
                  number: 8008
