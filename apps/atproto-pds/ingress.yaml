---
# PDS at a single proxied host, mirroring matrix: Cloudflare proxies
# pds.alucard.dev (origin IP stays hidden) and cert-manager issues the origin
# cert via the letsencrypt-prod ClusterIssuer (DNS-01). No wildcard — user
# handles use custom domains (@you.alucard.dev) verified per-account.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pds
  namespace: atproto
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - pds.alucard.dev
      secretName: pds-tls
  rules:
    - host: pds.alucard.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pds
                port:
                  number: 3000
