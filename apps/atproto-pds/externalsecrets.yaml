---
# Bluesky PDS secrets from Vault, injected as env vars. Never in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pds-secrets
  namespace: atproto
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: pds-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PDS_JWT_SECRET: "{{ .jwt_secret }}"
        PDS_ADMIN_PASSWORD: "{{ .admin_password }}"
        PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: "{{ .plc_rotation_key }}"
  data:
    - secretKey: jwt_secret
      remoteRef:
        key: atproto/pds
        property: jwt_secret
    - secretKey: admin_password
      remoteRef:
        key: atproto/pds
        property: admin_password
    - secretKey: plc_rotation_key
      remoteRef:
        key: atproto/pds
        property: plc_rotation_key
