---
# Persistent storage for the PDS: SQLite databases + blob store (/pds).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pds-data
  namespace: atproto
  annotations:
    # Never allow Flux to prune this PVC - data is irreplaceable
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
