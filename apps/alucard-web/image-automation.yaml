---
# ImageRepository watches the Gitea container registry for new images
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: alucard-web
  namespace: flux-system
spec:
  image: code.alucard.dev/spencerrung/alucard-web
  interval: 5m
  secretRef:
    name: gitea-registry-credentials
---
# ImagePolicy defines which image tags to use (latest semver or by timestamp)
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: alucard-web
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: alucard-web
  policy:
    alphabetical:
      order: asc
---
# Secret with Gitea registry credentials for Flux image automation
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-registry-credentials-flux
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: gitea-registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "code.alucard.dev": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ printf "%s:%s" .username .token | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: gitea/registry-credentials
        property: username
    - secretKey: token
      remoteRef:
        key: gitea/registry-credentials
        property: token
---
# ImageUpdateAutomation updates the deployment manifest when new images are available
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: alucard-web
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        Update alucard-web image to {{range .Updated.Images}}{{println .}}{{end}}
    push:
      branch: main
  update:
    path: ./apps/alucard-web
    strategy: Setters
