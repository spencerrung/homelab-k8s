---
# Central LLM gateway: every agent/app in the cluster points here instead
# of holding provider keys. Wildcard route passes through all Anthropic
# models; add another provider = one more wildcard block + key in Vault.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      - model_name: "anthropic/*"
        litellm_params:
          model: "anthropic/*"
          api_key: os.environ/ANTHROPIC_API_KEY
      # friendly aliases
      - model_name: claude
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-fast
        litellm_params:
          model: anthropic/claude-haiku-4-5-20251001
          api_key: os.environ/ANTHROPIC_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.91.0
          args:
            - --config
            - /config/config.yaml
            - --port
            - "4000"
          envFrom:
            - secretRef:
                name: litellm-secrets
          # surface boot progress; buffered output vanishes on SIGKILL
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-postgresql
                  key: DATABASE_URL
          ports:
            - containerPort: 4000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # boot (prisma client generation) spikes well past steady-state
            limits:
              memory: 2Gi
          # first boot runs prisma client generation - >5min on a Pi 4
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 12
            timeoutSeconds: 8
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: http
      name: http
---
# Admin UI at /ui, API at /v1 - both gated by the master key.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: litellm
  namespace: ai
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - llm.alucard.dev
      secretName: litellm-tls
  rules:
    - host: llm.alucard.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: litellm
                port:
                  number: 4000
