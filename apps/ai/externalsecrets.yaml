---
# LiteLLM: master key (gateway auth) + provider API keys.
# Seed: vault kv put secret/ai/litellm master_key=sk-<random> anthropic_api_key=<key>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: ai/litellm
        property: master_key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ai/litellm
        property: anthropic_api_key
---
# Postgres for LiteLLM spend tracking / virtual keys.
# Seed: vault kv put secret/ai/postgresql username=litellm password=<random>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-postgresql
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ai-postgresql
    creationPolicy: Owner
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgresql.ai.svc.cluster.local:5432/litellm"
  data:
    - secretKey: username
      remoteRef:
        key: ai/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: ai/postgresql
        property: password
---
# Open WebUI session secret; it authenticates to LiteLLM with the master
# key (switch to a LiteLLM virtual key later if per-app spend split is wanted).
# Seed: vault kv put secret/ai/openwebui secret_key=<random>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openwebui-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: openwebui-secrets
    creationPolicy: Owner
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: ai/openwebui
        property: secret_key
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: ai/litellm
        property: master_key
---
# SearXNG instance secret.
# Seed: vault kv put secret/ai/searxng secret_key=<random>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-secrets
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: searxng-secrets
    creationPolicy: Owner
  data:
    - secretKey: SEARXNG_SECRET
      remoteRef:
        key: ai/searxng
        property: secret_key
