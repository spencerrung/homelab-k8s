apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimtrix
  namespace: aimtrix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aimtrix
  template:
    metadata:
      labels:
        app: aimtrix
    spec:
      containers:
        - name: web
          image: docker.io/spencerrung/aimtrix:v0.3.0-rc.2@sha256:ac3c2f1ed2d21d8348d7e7ebc21cbfe87a34e1517e72875b64d8654b94f6dc2d # pinned release candidate; upgrades remain deliberate
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
