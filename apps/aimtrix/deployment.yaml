apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimtrix
  namespace: aimtrix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aimtrix
  template:
    metadata:
      labels:
        app: aimtrix
    spec:
      containers:
        - name: web
          image: docker.io/spencerrung/aimtrix:v0.1.0@sha256:abbaab6edaccbaab9268ad541864dc21e69fc8be36100ea66535bf399d728d1e # pinned release; restore the image-policy marker after the refactor
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
