apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimtrix
  namespace: aimtrix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aimtrix
  template:
    metadata:
      labels:
        app: aimtrix
    spec:
      containers:
        - name: web
          image: docker.io/spencerrung/aimtrix:v0.3.0-rc.4@sha256:ab2819a1032b13490748f553ce0b261ccf095321192c1b7b9a95ec22d8fbaab1 # pinned release candidate; upgrades remain deliberate
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
