apiVersion: apps/v1
kind: Deployment
metadata:
  name: aimtrix
  namespace: aimtrix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aimtrix
  template:
    metadata:
      labels:
        app: aimtrix
    spec:
      containers:
        - name: web
          image: docker.io/spencerrung/aimtrix:v0.2.4@sha256:f63cdcb61741f0eb267403ef43207cd2d2ca8e4f1f56b23343b4f2b367dcae21 # pinned release; upgrades remain deliberate
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
