---
# Anthropic API key from Vault. Seed with:
#   vault kv put secret/daily-news ANTHROPIC_API_KEY=<key>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: daily-news-secrets
  namespace: daily-news
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: daily-news-secrets
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: daily-news
        property: ANTHROPIC_API_KEY
