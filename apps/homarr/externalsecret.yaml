---
# Homarr encrypts stored integration credentials (arr API keys etc.)
# with this key — losing it means re-entering integrations. Seed once:
#   vault kv put secret/homarr/config encryption_key=$(openssl rand -hex 32)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-secrets
  namespace: homarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: homarr-secrets
    creationPolicy: Owner
  data:
    - secretKey: SECRET_ENCRYPTION_KEY
      remoteRef:
        key: homarr/config
        property: encryption_key
