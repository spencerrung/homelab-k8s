---
# Restarts only the qBittorrent Deployment when Kubernetes reports no ready
# replica for at least 15 minutes. Container probes remain the first line of
# recovery; brief VPN/DNS readiness dips must not restart the entire pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qbittorrent-watchdog
  namespace: media
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qbittorrent-watchdog
  namespace: media
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["qbittorrent"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qbittorrent-watchdog
  namespace: media
subjects:
  - kind: ServiceAccount
    name: qbittorrent-watchdog
    namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qbittorrent-watchdog
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: qbittorrent-watchdog
  namespace: media
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: qbittorrent-watchdog
        spec:
          serviceAccountName: qbittorrent-watchdog
          restartPolicy: Never
          containers:
            - name: watchdog
              # rancher/kubectl is distroless and cannot execute the shell
              # recovery script. This multi-arch image includes kubectl and
              # /bin/sh and tracks the cluster's Kubernetes minor version.
              image: alpine/k8s:1.29.10
              command:
                - sh
                - -ec
                - |
                  desired=$(kubectl get deployment/qbittorrent \
                    -o jsonpath='{.spec.replicas}')
                  available=$(kubectl get deployment/qbittorrent \
                    -o jsonpath='{.status.availableReplicas}')
                  if [ "${available:-0}" -ge "${desired:-1}" ]; then
                    echo "qBittorrent is available (${available}/${desired})"
                    exit 0
                  fi
                  # Availability can briefly drop while Gluetun reconnects
                  # or its resolver retries. Allow probes to recover it first.
                  unavailable_since=$(kubectl get deployment/qbittorrent \
                    -o jsonpath='{.status.conditions[?(@.type=="Available")].lastTransitionTime}')
                  availability=$(kubectl get deployment/qbittorrent \
                    -o jsonpath='{.status.conditions[?(@.type=="Available")].status}')
                  if [ "$availability" != "False" ] || [ -z "$unavailable_since" ]; then
                    echo "No confirmed unavailability interval; leaving recovery to probes"
                    exit 0
                  fi
                  # This format works with both BusyBox and GNU date.
                  normalized=$(printf '%s' "$unavailable_since" | tr 'T' ' ' | tr -d 'Z')
                  since_epoch=$(date -u -d "$normalized" +%s)
                  age_seconds=$(( $(date -u +%s) - since_epoch ))
                  if [ "$age_seconds" -lt 900 ]; then
                    echo "qBittorrent unavailable for ${age_seconds}s; waiting for 900s before restarting"
                    exit 0
                  fi
                  echo "qBittorrent unavailable for ${age_seconds}s (${available:-0}/${desired}); restarting"
                  kubectl rollout restart deployment/qbittorrent
                  echo "restart requested"
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 64Mi
