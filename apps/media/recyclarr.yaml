---
# Syncs TRaSH-guides custom formats into Sonarr on a schedule.
# Language policy: prefer dual-audio/multi releases (+100), block
# non-English-only releases (-10000), upgrade English -> dual audio
# when one appears (until_score: 100).
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
data:
  recyclarr.yml: |
    sonarr:
      main:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true
        quality_profiles:
          - name: HD - 720p/1080p
            upgrade:
              allowed: true
              until_quality: HDTV-720p
              until_score: 100
            min_format_score: 0
        custom_formats:
          - trash_ids:
              - 7ba05c6e0e14e793538174c679126996 # MULTi
              - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
            assign_scores_to:
              - name: HD - 720p/1080p
                score: 100
          # Language: Not English — trash default score is -10000
          - trash_ids:
              - 69aa1e159f97d860440b04cd6d590c4f
            assign_scores_to:
              - name: HD - 720p/1080p
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: recyclarr
        spec:
          restartPolicy: Never
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.6.0
              args: ["sync"]
              env:
                - name: TZ
                  value: Etc/UTC
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-api-keys
                      key: sonarr
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: recyclarr-config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
          volumes:
            - name: config
              emptyDir: {}
            - name: recyclarr-config
              configMap:
                name: recyclarr-config
