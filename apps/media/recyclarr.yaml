---
# Syncs TRaSH-guides custom formats into Sonarr on a schedule.
# Language policy: prefer dual-audio/multi releases (+100), block
# non-English-only releases (-10000), upgrade English -> dual audio
# when one appears (until_score: 100).
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: media
data:
  recyclarr.yml: |
    # NOTE: instance names (tv/movies) must be unique across services —
    # recyclarr silently syncs nothing if two instances share a name.
    sonarr:
      tv:
        base_url: http://sonarr:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true
        # TRaSH naming: rename on import + season folders — players
        # (plex) parse filenames, scene names misparse (e.g. anime
        # "(2025) - 01" reads as S01E01).
        media_naming:
          series: default
          season: default
          episodes:
            rename: true
            standard: default
            daily: default
            anime: default
        quality_profiles:
          - name: HD - 720p/1080p
            upgrade:
              allowed: true
              until_quality: HDTV-720p
              until_score: 100
            min_format_score: 0
          # Anime profile: sonarr falls back to the series' original
          # language (Japanese) for untagged anime releases, so a
          # "Not English" block would reject everything incl. dual
          # audio. Prefer dual audio by title tag; accept the rest.
          - name: HD - 720p/1080p Anime
            upgrade:
              allowed: true
              until_quality: HDTV-720p
              until_score: 100
            min_format_score: 0
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: Bluray-720p
              - name: WEB 720p
                qualities:
                  - WEBDL-720p
                  - WEBRip-720p
              - name: HDTV-1080p
              - name: HDTV-720p
        custom_formats:
          - trash_ids:
              - 7ba05c6e0e14e793538174c679126996 # MULTi
              - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
            assign_scores_to:
              - name: HD - 720p/1080p
                score: 100
              - name: HD - 720p/1080p Anime
                score: 100
          # Language: Not English — trash default score is -10000.
          # Standard profile only; never assign to the anime profile.
          - trash_ids:
              - 69aa1e159f97d860440b04cd6d590c4f
            assign_scores_to:
              - name: HD - 720p/1080p
          # Anime: non-English audio only with English/multi subs —
          # block raw groups (no subs) and foreign-sub releases.
          # Trash default score is -10000.
          - trash_ids:
              - b4a1b3d705159cdca36d71e57ca86871 # Anime Raws
              - 07a32f77690263bb9fda1842db7e273f # VOSTFR
            assign_scores_to:
              - name: HD - 720p/1080p Anime
    # Same language policy as sonarr; note radarr trash_ids differ.
    radarr:
      movies:
        base_url: http://radarr:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true
        media_naming:
          folder: default
          movie:
            rename: true
            standard: standard
        quality_profiles:
          - name: HD - 720p/1080p
            upgrade:
              allowed: true
              until_quality: Bluray-720p
              until_score: 100
            min_format_score: 0
          - name: HD - 720p/1080p Anime
            upgrade:
              allowed: true
              until_quality: Bluray-720p
              until_score: 100
            min_format_score: 0
            qualities:
              - name: Remux-1080p
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p
              - name: Bluray-720p
              - name: WEB 720p
                qualities:
                  - WEBDL-720p
                  - WEBRip-720p
              - name: HDTV-720p
        custom_formats:
          - trash_ids:
              - 4b900e171accbfb172729b63323ea8ca # MULTi
              - 4a3b087eea2ce012fcc1ce319259a3be # Anime Dual Audio
            assign_scores_to:
              - name: HD - 720p/1080p
                score: 100
              - name: HD - 720p/1080p Anime
                score: 100
          # Language: Not English — standard profile only
          - trash_ids:
              - 0dc8aec3bd1c47cd6c40c46ecd27e846
            assign_scores_to:
              - name: HD - 720p/1080p
          # Anime Raws + VOSTFR — anime profile only
          - trash_ids:
              - 06b6542a47037d1e33b15aa3677c2365 # Anime Raws
              - 9172b2f683f6223e3a1846427b417a3d # VOSTFR
            assign_scores_to:
              - name: HD - 720p/1080p Anime
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: recyclarr
        spec:
          restartPolicy: Never
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.6.0
              args: ["sync"]
              env:
                - name: TZ
                  value: Etc/UTC
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-api-keys
                      key: sonarr
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-api-keys
                      key: radarr
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: recyclarr-config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
          volumes:
            - name: config
              emptyDir: {}
            - name: recyclarr-config
              configMap:
                name: recyclarr-config
