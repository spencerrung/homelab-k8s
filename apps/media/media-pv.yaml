---
# Static RWX PV for the shared media tree on the UNAS. Every consumer
# mounts it at /data (same path everywhere = hardlink imports instead of
# copies): /data/downloads, /data/tv, /data/movies.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-arr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 10.10.10.62/volume/cb9d8e3a-aadf-446d-b16c-b701b8199c8c/.srv/.unifi-drive/arr/.data
    volumeAttributes:
      server: 10.10.10.62
      share: /volume/cb9d8e3a-aadf-446d-b16c-b701b8199c8c/.srv/.unifi-drive/arr/.data
  mountOptions:
    # UNAS serves NFSv3 only (no v4 pseudo-root); nolock keeps locks local
    # to the single client per volume, which is consistent for our use
    - nfsvers=3
    - nolock
    - noatime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: media-arr
  resources:
    requests:
      storage: 1Ti
