---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Posts to the matrix #downloads room on torrent completion. Wired to
# qBittorrent's "run external program on completion" setting (runtime
# preference, set via API). The in-cluster synapse service is reachable
# because the gluetun killswitch allows 10.43.0.0/16 egress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: qbittorrent-scripts
  namespace: media
data:
  notify-matrix.sh: |
    #!/bin/sh
    # $1 = torrent name (qBittorrent passes %N)
    TITLE=$(printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g')
    curl -s -m 15 -X PUT \
      -H "Authorization: Bearer ${MATRIX_TOKEN}" \
      -H "Content-Type: application/json" \
      -d "{\"msgtype\":\"m.text\",\"body\":\"✅ Finished downloading: ${TITLE}\"}" \
      "http://synapse.matrix.svc.cluster.local:8008/_matrix/client/v3/rooms/${MATRIX_ROOM}/send/m.room.message/qbt$(date +%s)$$" \
      >/dev/null
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
        # VPN sidecar: shares the pod's network namespace, so ALL of
        # qBittorrent's traffic rides the PIA tunnel. The firewall
        # (killswitch) drops non-tunnel egress except the cluster subnets
        # and admits inbound only on the WebUI port - if the tunnel drops,
        # torrent traffic stops rather than leaking to the ISP.
        - name: gluetun
          image: docker.io/qmcgaw/gluetun:v3.41.1
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: VPN_SERVICE_PROVIDER
              value: private internet access
            # Pi 4 (Cortex-A72) has no AES hardware; the default "strong"
            # preset was CPU-bound at ~280KiB/s. normal = AES-128, and the
            # MSS clamp avoids fragmentation collapse over the tunnel.
            - name: PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET
              value: normal
            # CRITICAL: flannel VXLAN pod interfaces are MTU 1450; OpenVPN's
            # default tun-mtu 1500 fragments every packet (~250KiB/s). 1380
            # fits inside the overlay and was worth a 6x speedup.
            - name: OPENVPN_FLAGS
              value: --tun-mtu 1380 --mssfix 1300
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: media-vpn
                  key: username
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: media-vpn
                  key: password
            # PIA offers port forwarding only outside the US; Toronto is
            # the nearest PF-capable region. To prefer US egress instead,
            # set a US region and VPN_PORT_FORWARDING=off.
            - name: SERVER_REGIONS
              value: CA Toronto
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: 10.42.0.0/16,10.43.0.0/16
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: /bin/sh -c 'wget -q -O- --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8080/api/v2/app/setPreferences'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:5.2.2
          env:
            # match the UNAS NFS anon-squash identity so client-side
            # permission checks pass on /data
            - name: PUID
              value: "977"
            - name: PGID
              value: "988"
            - name: TZ
              value: Etc/UTC
            - name: WEBUI_PORT
              value: "8080"
            - name: MATRIX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: media-matrix-bot
                  key: access_token
            - name: MATRIX_ROOM
              valueFrom:
                secretKeyRef:
                  name: media-matrix-bot
                  key: room_id
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 6881
              name: torrent-tcp
              protocol: TCP
            - containerPort: 6881
              name: torrent-udp
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # qbt 5.x / libtorrent 2 uses mmap I/O; mapped pages count
            # against the cgroup, so heavy downloads OOM small limits.
            # Pairs with the in-app "memory_working_set_limit" preference.
            limits:
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: media
        - name: scripts
          configMap:
            name: qbittorrent-scripts
            defaultMode: 0755
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  selector:
    app: qbittorrent
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - qbt.alucard.dev
      secretName: qbittorrent-tls
  rules:
    - host: qbt.alucard.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
