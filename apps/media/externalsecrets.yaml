---
# Fixed API keys for the arr apps, injected via the servarr env-config
# convention (SONARR__AUTH__APIKEY etc.). Keys live in Vault so the
# prowlarr->arr and jellyseerr->arr connections are deterministic and
# survive rebuilds. Seed once:
#   vault kv put secret/media/api-keys sonarr=<hex32> radarr=<hex32> prowlarr=<hex32>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-api-keys
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: media-api-keys
    creationPolicy: Owner
  data:
    - secretKey: sonarr
      remoteRef:
        key: media/api-keys
        property: sonarr
    - secretKey: radarr
      remoteRef:
        key: media/api-keys
        property: radarr
    - secretKey: prowlarr
      remoteRef:
        key: media/api-keys
        property: prowlarr
---
# Postgres credentials shared by the postgres server and the arr clients.
# Seed once:
#   vault kv put secret/media/postgresql username=arr password=<random>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-postgresql
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: media-postgresql
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: media/postgresql
        property: username
    - secretKey: password
      remoteRef:
        key: media/postgresql
        property: password
---
# PIA credentials for the gluetun VPN sidecar. Seed once:
#   vault kv put secret/media/vpn username=p1234567 password=<PIA password>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-vpn
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: media-vpn
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: media/vpn
        property: username
    - secretKey: password
      remoteRef:
        key: media/vpn
        property: password
