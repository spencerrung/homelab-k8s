---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      # Official Seerr runs as node (1000); grant access to the existing
      # config PVC and the init container's shared patched module.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: patch-season-search
          # Keep identical to the application image: patch checks its source.
          image: ghcr.io/seerr-team/seerr:v3.5.2
          command: ["node", "/patch/patch.cjs"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: season-search-patch
              mountPath: /patch
              readOnly: true
            - name: patched-sonarr
              mountPath: /patched
      containers:
        - name: jellyseerr
          image: ghcr.io/seerr-team/seerr:v3.5.2
          env:
            - name: TZ
              value: Etc/UTC
          ports:
            - containerPort: 5055
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: patched-sonarr
              mountPath: /app/dist/api/servarr/sonarr.js
              subPath: sonarr.js
              readOnly: true
            - name: config
              mountPath: /app/config
      volumes:
        - name: season-search-patch
          configMap:
            name: jellyseerr-season-search-patch
        - name: patched-sonarr
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: media
spec:
  selector:
    app: jellyseerr
  ports:
    - port: 5055
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyseerr
  namespace: media
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  tls:
    - hosts:
        - requests.alucard.dev
      secretName: jellyseerr-tls
  rules:
    - host: requests.alucard.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyseerr
                port:
                  number: 5055
